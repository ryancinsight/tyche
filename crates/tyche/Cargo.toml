[package]
# Registry name only. The crates.io name `tyche` belongs to an unrelated
# third-party crate, so this publishes as `tyche-uncertainty` while
# `[lib] name` keeps the import path `tyche` — the same split the stack uses
# for `moirai-runtime`, `mnemosyne-memory`, `themis-topology`, `iris-viz`, and
# `gaia-mesh`. Consumers write
# `tyche = { package = "tyche-uncertainty", version = "0.1.0" }` and every
# `use tyche::…` is unchanged.
name = "tyche-uncertainty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Atlas reproducible uncertainty-study foundation"
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["uncertainty", "sampling", "sensitivity", "simulation"]
categories = ["science"]

[lib]
# Import path stays `tyche` regardless of the registry name above.
name = "tyche"
path = "src/lib.rs"
publish.workspace = true

[dependencies]
tyche-core = { workspace = true }
tyche-moirai = { workspace = true, optional = true }
tyche-consus = { workspace = true, optional = true }

[features]
default = ["std", "moirai", "consus"]
std = ["tyche-core/std"]
moirai = ["std", "dep:tyche-moirai"]
consus = ["std", "dep:tyche-consus"]

[lints]
workspace = true
