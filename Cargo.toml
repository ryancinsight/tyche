[workspace]
resolver = "3"
members = [
    "crates/tyche-core",
    "crates/tyche-moirai",
    "crates/tyche-consus",
    "crates/tyche",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
repository = "https://github.com/ryancinsight/tyche"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tyche-core = { path = "crates/tyche-core", version = "0.1.0", default-features = false }
tyche-moirai = { path = "crates/tyche-moirai", version = "0.1.0" }
tyche-consus = { path = "crates/tyche-consus", version = "0.1.0" }
eunomia = { version = "0.7.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
consus-core = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", default-features = false, features = ["alloc"] }
consus-zarr = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", default-features = false, features = ["std"] }
moirai-core = { path = "../moirai/moirai-core", version = "0.4.0" }
moirai-executor = { path = "../moirai/moirai-executor", version = "0.4.0" }
proptest = "1.11.0"
stats_alloc = "0.1.10"
criterion = "0.8.2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"
overflow-checks = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
overflow-checks = true

[profile.release]
debug = false
strip = "symbols"
overflow-checks = true


# ATLAS-PATH-DEP-AUDIT-2: redirect git+https sibling pulls to local working
# copies so the entire dep graph uses a single version of each Atlas
