name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          components: clippy, rustfmt
      # Shared-key rust-cache so the workspace build is warm across PRs instead
      # of rebuilding from scratch each time. One entry is written from main
      # only (concurrent branches cannot evict it); invalidation is
      # incremental, so a dependency repin rebuilds only the affected crates,
      # not the whole workspace. Mirrors the CFDrs #375/ritk #211/helios
      # #75/themis #32 lever under ATLAS-CI-RUNNER-SATURATION.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          workspaces: .
          shared-key: tyche
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      - run: cargo fmt --all -- --check
      - run: cargo check -p tyche-core --no-default-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --doc --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run -p tyche-uncertainty --example reproducible_study
      # Single-iteration smoke: the bench binary is a delivered target, so it
      # must compile and execute every case. Timing runs are local.
      - run: cargo bench -p tyche-core --bench counter_sampling -- --test

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
